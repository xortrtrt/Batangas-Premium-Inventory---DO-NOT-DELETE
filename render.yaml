services:
  - type: web
    name: batangas-premium-inventory
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: CSRF_PROTECTION_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Manila
