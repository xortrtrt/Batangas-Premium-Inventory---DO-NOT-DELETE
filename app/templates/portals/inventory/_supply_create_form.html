<form
  novalidate
  method="post"
  action="/portal/inventory/supplies/items"
  class="form-panel bare"
  data-supply-form
  enctype="multipart/form-data"
>
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
  <input
    type="hidden"
    name="submission_reference"
    value="{{ supply_create_reference }}"
  />
  <div class="form-grid">
    <div class="supplies-field">
      <label for="supply-name">Item name</label
      ><input
        id="supply-name"
        name="name"
        required
        maxlength="120"
        placeholder="T-shirt"
      />
    </div>
    <div class="supplies-field">
      <label for="supply-category">Category</label
      ><input
        id="supply-category"
        name="category"
        required
        maxlength="80"
        list="supply-category-suggestions"
        placeholder="Apparel"
      />
    </div>
    <div class="supplies-field">
      <label for="supply-unit">Counting unit</label
      ><select id="supply-unit" name="unit" data-supply-unit>
        {% for value,label in supply_units %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="supplies-field">
      <label for="supply-initial-quantity">Opening balance (optional)</label
      ><input
        id="supply-initial-quantity"
        name="initial_quantity"
        type="number"
        min="0"
        max="999999999"
        step="1"
        value="0"
        data-supply-quantity
        required
      />
    </div>
  </div>
  {{ photo_input('new-supply-image') }}

  <footer class="inventory-modal-actions">
    <button class="button subtle" type="button" data-inventory-modal-close>
      Cancel</button
    ><button class="button primary" type="submit">
      <i data-lucide="plus" aria-hidden="true"></i>Create supply item
    </button>
  </footer>
</form>
