[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["postgres: uses only an explicit disposable TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/repositories/*.py" = ["F403", "F405"]
"tools/*.py" = ["E402"]
