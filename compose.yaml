name: bp-inventory

services:
  db:
    image: postgres:18.6-alpine
    env_file:
      - .env.docker
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    container_name: bp-inventory
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - profile-uploads:/app/app/static/uploads/profiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  profile-uploads:
